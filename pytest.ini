[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
markers =
    unit: unit tests with mocks only (default)
    slow: tests that take > 1s (rare for unit tests)
filterwarnings =
    error
    ignore::DeprecationWarning:azure.*
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:pydantic.*
