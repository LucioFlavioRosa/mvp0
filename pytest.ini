[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -m "not slow"
markers =
    unit: unit tests with mocks only (default)
    slow: tests com state global ou > 1s; rodar separado com `pytest -m slow`
filterwarnings =
    error
    ignore::DeprecationWarning:azure.*
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:pydantic.*
